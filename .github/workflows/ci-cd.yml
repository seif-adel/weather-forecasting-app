name: weather-ci-cd

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_WORKING_DIR: infra/terraform
  REPO_NAME: weather-dev-backend

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements-dev.txt

      - name: Run backend tests
        env:
          PYTHONPATH: src/backend
        run: pytest src/backend/tests -q

      - name: Debug OIDC claims (sub/aud)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            echo "OIDC request variables are not available in this run context."
            exit 0
          fi

          RESP="$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"

          TOKEN="$(echo "$RESP" | jq -r '.value // empty')"
          if [[ -z "$TOKEN" ]]; then
            echo "No OIDC token returned. Full response:"
            echo "$RESP"
            exit 0
          fi

          export TOKEN

          python - <<'PY'
          import base64
          import json
          import os

          token = os.environ["TOKEN"]
          parts = token.split(".")
          if len(parts) < 2:
              print("Invalid JWT format")
              raise SystemExit(0)

          payload = parts[1]
          payload += "=" * (-len(payload) % 4)
          decoded = base64.urlsafe_b64decode(payload.encode("utf-8"))
          obj = json.loads(decoded.decode("utf-8"))
          subset = {
              "iss": obj.get("iss"),
              "aud": obj.get("aud"),
              "sub": obj.get("sub"),
              "repository": obj.get("repository"),
              "ref": obj.get("ref"),
              "job_workflow_ref": obj.get("job_workflow_ref"),
              "environment": obj.get("environment"),
          }
          print(json.dumps(subset, indent=2))
          PY
          
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine account ID
        id: account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init (remote state)
        run: |
          terraform -chdir=${{ env.TF_WORKING_DIR }} init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.TF_STATE_KEY }}" \
            -backend-config="region=${{ secrets.TF_STATE_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} validate

      - name: Import existing ECR repo into state (if needed)
        run: |
          if aws ecr describe-repositories --repository-names "$REPO_NAME" >/dev/null 2>&1; then
            terraform -chdir=${{ env.TF_WORKING_DIR }} state show aws_ecr_repository.backend >/dev/null 2>&1 \
              || terraform -chdir=${{ env.TF_WORKING_DIR }} import aws_ecr_repository.backend "$REPO_NAME"
          fi

      - name: Terraform apply (bootstrap ECR)
        env:
          TF_VAR_rapidapi_key: ${{ secrets.RAPIDAPI_KEY }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_region: ${{ secrets.AWS_REGION }}
          TF_VAR_allow_public_frontend: true
        run: |
          terraform -chdir=${{ env.TF_WORKING_DIR }} apply -auto-approve -target=aws_ecr_repository.backend -var "image_tag=bootstrap"

      - name: Build and push Docker image
        env:
          ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ECR_URI="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$REPO_NAME"
          docker build -f src/backend/Dockerfile -t "$ECR_URI:$IMAGE_TAG" src/backend
          docker push "$ECR_URI:$IMAGE_TAG"

      - name: Terraform apply
        env:
          IMAGE_TAG: ${{ github.sha }}
          TF_VAR_rapidapi_key: ${{ secrets.RAPIDAPI_KEY }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_region: ${{ secrets.AWS_REGION }}
          TF_VAR_allow_public_frontend: true
        run: |
          terraform -chdir=${{ env.TF_WORKING_DIR }} apply -auto-approve -var "image_tag=$IMAGE_TAG"
