<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skyline Weather</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-one"></div>
    <div class="bg-orb orb-two"></div>

    <main class="weather-shell">
      <header class="header">
        <p class="eyebrow">RapidAPI Weather Explorer</p>
        <h1>Skyline Weather</h1>
        <p class="subtitle">Search any city and get live weather from your backend API.</p>
      </header>

      <form id="weatherForm" class="search-row">
        <input
          id="cityInput"
          type="text"
          name="city"
          placeholder="Type a city name, e.g. Cairo"
          autocomplete="off"
          required
        />
        <button type="submit" id="searchButton">Check Weather</button>
      </form>

      <section id="status" class="status" aria-live="polite"></section>

      <section id="weatherCard" class="weather-card hidden">
        <div class="card-top">
          <div>
            <h2 id="cityName">-</h2>
            <p id="weatherDescription">-</p>
          </div>
          <div class="icon-wrap">
            <span id="weatherEmoji" class="emoji" aria-hidden="true">-</span>
            <img id="weatherIcon" alt="weather icon" />
          </div>
        </div>

        <div class="stats-grid">
          <article>
            <h3>Temperature</h3>
            <p id="tempValue">-</p>
          </article>
          <article>
            <h3>Feels Like</h3>
            <p id="feelsLikeValue">-</p>
          </article>
          <article>
            <h3>Humidity</h3>
            <p id="humidityValue">-</p>
          </article>
          <article>
            <h3>Wind</h3>
            <p id="windValue">-</p>
          </article>
        </div>
      </section>

      <details class="raw-json">
        <summary>Raw JSON response</summary>
        <pre id="rawJson">No data yet.</pre>
      </details>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
